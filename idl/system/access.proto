syntax = "proto3";

package system.access;

option go_package = "system/access";

import "idl/base.proto";

message ApiInfo {
  optional uint64 id = 1;
  optional string path = 2;
  optional string description = 3;
  optional string group = 4;
  optional string method = 5;
}

message ApiInfoListResp {
  repeated ApiInfo list = 1;
}

message RoleInfo {
  optional uint64 id = 1;
  optional string role_code = 2;
  optional string role_name = 3;
  optional string remark = 4;
}

message RoleInfoListResp {
  repeated RoleInfo list = 1;
}

service SystemAccessService {
  rpc initDatabase(base.Empty) returns (base.BaseResp);
  rpc createApi(ApiInfo) returns (base.BaseResp);
  rpc updateApi(ApiInfo) returns (base.BaseResp);
  rpc deleteApi(base.IDsReq) returns (base.BaseResp);
  rpc getApiList(base.Empty) returns (ApiInfoListResp);
  rpc createRole(RoleInfo) returns (base.BaseResp);
  rpc updateRole(RoleInfo) returns (base.BaseResp);
  rpc deleteRole(base.IDsReq) returns (base.BaseResp);
  rpc getRoleList(base.Empty) returns (RoleInfoListResp);
}