DatabaseConf:
  Type: "mysql"
  Host: 127.0.0.1
  Port: 3306
  DBName: core
  Username: root # set your username
  Password: "123456" # set your password
  MaxOpenConn: 100
  SSLMode: disable
  CacheTime: 5

# Redis 配置
RedisConf:
  Host: localhost:6379

# 系统配置
SystemConf:
  Network: tcp
  Addr: 127.0.0.1
  Port: 8082

# Etcd 配置
EtcdConf:
  Endpoints: ["127.0.0.1:2379"]
  Username:
  Password:

# 日志配置
logger:
  level: info
  output_mode: all
  formatter: module_text
  file_path: ./logs/access.log
  max_age_days: 30
  compress: false

# 链路追踪配置（可选功能，默认关闭）
trace:
  enabled: false
  endpoint: "localhost:4317"
  insecure: true
  sample_ratio: 1.0
  export_timeout: 10s
  shutdown_timeout: 5s
  environment: "dev"