# System Token HTTP API 配置（服务名 api.system.token）。
DatabaseConf:
  Type: "mysql"
  Host: 127.0.0.1
  Port: 3306
  DBName: orzadmin
  Username: root # set your username
  Password: "123456" # set your password
  MaxOpenConn: 100
  SSLMode: disable
  CacheTime: 5

CasbinDatabaseConf:
  Type: "mysql"
  Host: 127.0.0.1
  Port: 3306
  DBName: orzadmin
  Username: root # set your username
  Password: "123456" # set your password
  MaxOpenConn: 100
  SSLMode: disable
  CacheTime: 5

# JWT 校验必须与其它 API 使用同一个 AccessSecret
AuthConf:
  AccessSecret: jS6VKDtsJf3z1n2VKDtsJf3z1n2
  AccessExpire: 259200

# Redis 配置
RedisConf:
  Host: localhost:6379

# 系统配置
SystemConf:
  Network: tcp
  Addr: 0.0.0.0
  Port: 8893

# 服务发现
DiscoveryConf:
  Method: "etcd"

# Etcd 配置（本地 docker 映射端口为 12379）
EtcdConf:
  Endpoints: ["127.0.0.1:12379"]
  Username:
  Password:

# 日志配置
logger:
  level: info
  output_mode: all
  formatter: module_text
  file_path: ./logs/api-token.log
  max_age_days: 30
  compress: false

# 链路追踪配置（可选功能，默认关闭）
trace:
  enabled: true
  endpoint: "localhost:4317"
  insecure: true
  sample_ratio: 1.0
  export_timeout: 10s
  shutdown_timeout: 5s
  environment: "dev"