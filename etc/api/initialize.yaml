# 初始化 API：只用于本机或受信内网执行表结构同步与种子补齐。
# 刻意不配置服务发现、Redis 与业务客户端，也不接受 DSN / SQL 入参。
DatabaseConf:
  Type: "mysql"
  Host: 127.0.0.1
  Port: 3306
  DBName: core
  Username: root # set your username
  Password: "123456" # set your password
  MaxOpenConn: 100
  SSLMode: disable
  CacheTime: 5

CasbinDatabaseConf:
  Type: "mysql"
  Host: 127.0.0.1
  Port: 3306
  DBName: core
  Username: root # set your username
  Password: "123456" # set your password
  MaxOpenConn: 100
  SSLMode: disable
  CacheTime: 5

# 只监听本机；确需跨机执行时改成受信内网地址并配合网络层访问控制。
SystemConf:
  Network: tcp
  Addr: 127.0.0.1
  Port: 8899

# 日志配置
logger:
  level: info
  output_mode: all
  formatter: module_text
  file_path: ./logs/api-initialize.log
  max_age_days: 30
  compress: false

# 链路追踪配置（可选功能，默认关闭）
trace:
  enabled: false
  endpoint: "localhost:4317"
  insecure: true
  sample_ratio: 1.0
  export_timeout: 10s
  shutdown_timeout: 5s
  environment: "dev"