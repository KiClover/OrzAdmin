# 初始化 API：只用于本机或受信内网触发各服务的初始化 RPC。
# 它自己不直接操作数据库：表结构与种子由各服务用自己的 Ent 实例维护。
DatabaseConf:
  Type: "mysql"
  Host: 127.0.0.1
  Port: 3306
  DBName: orzadmin
  Username: root # set your username
  Password: "123456" # set your password
  MaxOpenConn: 100
  SSLMode: disable
  CacheTime: 5

CasbinDatabaseConf:
  Type: "mysql"
  Host: 127.0.0.1
  Port: 3306
  DBName: orzadmin
  Username: root # set your username
  Password: "123456" # set your password
  MaxOpenConn: 100
  SSLMode: disable
  CacheTime: 5

AuthConf:
  AccessSecret: "replace-with-a-32-byte-secret"
  AccessExpire: 259200

# Redis 配置
RedisConf:
  Host: localhost:6379

# 系统配置：初始化 API 只监听本机
SystemConf:
  Network: tcp
  Addr: 0.0.0.0
  Port: 8899

# 服务发现：与其它 API 一致，通过注册中心按服务名解析各服务实例。
DiscoveryConf:
  Method: "etcd"

# Etcd 配置（本地 docker 映射端口为 12379）
EtcdConf:
  Endpoints: ["127.0.0.1:12379"]
  Username:
  Password:

# 日志配置
logger:
  level: info
  output_mode: all
  formatter: module_text
  file_path: ./logs/api-initialize.log
  max_age_days: 30
  compress: false

# 链路追踪配置（可选功能，默认关闭）
trace:
  enabled: false
  endpoint: "localhost:4317"
  insecure: true
  sample_ratio: 1.0
  export_timeout: 10s
  shutdown_timeout: 5s
  environment: "dev"
