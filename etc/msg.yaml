DatabaseConf:
  Type: "mysql"
  Host: 127.0.0.1
  Port: 3306
  DBName: core
  Username: root # set your username
  Password: "123456" # set your password
  MaxOpenConn: 100
  SSLMode: disable
  CacheTime: 5

# Redis 配置
RedisConf:
  Host: localhost:6379

# 系统配置
SystemConf:
  Network: tcp
  Addr: 127.0.0.1
  Port: 8083

# Etcd 配置
EtcdConf:
  Endpoints: ["127.0.0.1:2379"]
  Username:
  Password:

# 日志配置
logger:
  level: info
  output_mode: all
  formatter: module_text
  file_path: ./logs/message.log
  max_age_days: 30
  compress: false