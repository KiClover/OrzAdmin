# 链路追踪后端（可选组件）：Jaeger v2 all-in-one
# 启动：docker compose -f deploy/docker-compose.tracing.yml up -d
# UI  ：http://localhost:16686
# OTLP：4317 (gRPC) / 4318 (HTTP)
name: orzadmin-tracing

services:
  jaeger:
    image: jaegertracing/jaeger:2.22.0
    container_name: orzadmin-jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    restart: unless-stopped
